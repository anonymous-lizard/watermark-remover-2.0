<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark Removal - Sora Video Processor</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="tool-header">
            <a href="/" class="back-link">← Back to Tools</a>
            <h1 class="tool-title">Remove Watermark</h1>
        </div>

        <div id="upload-area" class="upload-section">
            <div class="upload-icon">📁</div>
            <h3>Upload Video</h3>
            <p>Drag & drop or click to browse</p>
            <p>Supported: MP4, MOV, AVI (max 1080p)</p>
            <input type="file" id="file-input" accept="video/*">
            <button id="upload-btn" class="upload-btn">Choose File</button>
            <div id="selected-info" class="selected-info" aria-live="polite"></div>
        </div>

        <div id="watermark-options" class="options-section">
            <h3>Processing Options</h3>

            <div class="option-group">
                <label class="checkbox-group">
                    <input type="checkbox" name="auto_detect" checked>
                    Auto-detect watermark
                </label>
            </div>

            <div class="option-group">
                <label class="checkbox-group">
                    <input type="checkbox" name="manual_bbox">
                    Manual bounding box (if auto-detect fails)
                </label>
            </div>

            <div class="option-group">
                <label>Temporal Blend Frames</label>
                <div class="slider-group">
                    <input type="range" name="temporal_blend_frames" min="1" max="10" value="5" step="1">
                    <span class="value">5</span>
                </div>
            </div>
        </div>

        <div class="process-section">
            <button id="process-btn" class="process-btn" disabled>🚀 Process Video</button>
        </div>
        <div id="preview-section" class="preview-section hidden">
            <h3>Uploaded Video Preview</h3>
            <video id="preview-video" controls width="480"></video>
            <div style="margin-top: 8px;">
                <a id="view-uploaded-btn" class="download-btn" href="#" target="_blank">🔎 View Uploaded Video</a>
            </div>
        </div>
        <div id="progress-section" class="progress-section hidden">
            <h3>Processing Status</h3>
            <div class="progress-info">
                <span id="progress-text">Preparing...</span>
                <span id="eta-text">Estimated time: calculating...</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <div id="download-section" class="download-section hidden">
            <a id="download-btn" class="download-btn" href="#" download>⬇️ Download Processed Video</a>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
