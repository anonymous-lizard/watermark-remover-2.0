<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Pipeline - Sora Video Processor</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="tool-header">
            <a href="/" class="back-link">← Back to Tools</a>
            <h1 class="tool-title">Full Processing Pipeline</h1>
        </div>

        <div id="upload-area" class="upload-section">
            <div class="upload-icon">📁</div>
            <h3>Upload Video</h3>
            <p>Drag & drop or click to browse</p>
            <p>Supported: MP4, MOV, AVI (max 1080p)</p>
            <input type="file" id="file-input" accept="video/*">
            <button id="upload-btn" class="upload-btn">Choose File</button>
        </div>

        <div id="pipeline-options" class="options-section">
            <h3>Processing Pipeline</h3>
            <p style="color: var(--gray-text); margin-bottom: var(--space-4);">Select which processing steps to apply:</p>

            <div class="option-group">
                <label class="checkbox-group">
                    <input type="checkbox" name="enable_watermarkremover" checked>
                    Remove watermarks
                </label>
            </div>

            <div class="option-group">
                <label class="checkbox-group">
                    <input type="checkbox" name="enable_noisereducer" checked>
                    Reduce noise
                </label>
            </div>

            <div class="option-group">
                <label class="checkbox-group">
                    <input type="checkbox" name="enable_colorcorrector" checked>
                    Color correction
                </label>
            </div>

            <div class="option-group">
                <label class="checkbox-group">
                    <input type="checkbox" name="enable_videoupscaler" checked>
                    Upscale resolution
                </label>
                <div style="margin-left: var(--space-4); margin-top: var(--space-2);">
                    <select name="target_resolution" style="width: 100%; padding: var(--space-2); border: 1px solid var(--border); border-radius: 4px;">
                        <option value="720p">720p</option>
                        <option value="1080p" selected>1080p</option>
                    </select>
                </div>
            </div>

            <div class="option-group">
                <label class="checkbox-group">
                    <input type="checkbox" name="enable_videostabilizer">
                    Video stabilization
                </label>
                <div style="margin-left: var(--space-4); margin-top: var(--space-2);">
                    <label style="font-size: var(--text-sm);">Strength:</label>
                    <div class="slider-group">
                        <input type="range" name="smoothness" min="0" max="1" value="0.5" step="0.1">
                        <span class="value">0.5</span>
                    </div>
                </div>
            </div>

            <div class="option-group">
                <label class="checkbox-group">
                    <input type="checkbox" name="enable_aspectadjuster">
                    Adjust aspect ratio
                </label>
                <div style="margin-left: var(--space-4); margin-top: var(--space-2);">
                    <select name="target_aspect" style="width: 100%; padding: var(--space-2); border: 1px solid var(--border); border-radius: 4px;">
                        <option value="16:9" selected>16:9 (YouTube)</option>
                        <option value="9:16">9:16 (Instagram Stories)</option>
                        <option value="1:1">1:1 (Instagram Square)</option>
                        <option value="4:3">4:3 (Traditional)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="process-section">
            <button id="process-btn" class="process-btn" disabled>🚀 Process Video</button>
        </div>

        <div id="progress-section" class="progress-section hidden">
            <h3>Processing Status</h3>
            <div class="progress-info">
                <span id="progress-text">Preparing...</span>
                <span id="eta-text">Estimated time: calculating...</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <div id="download-section" class="download-section hidden">
            <a id="download-btn" class="download-btn" href="#" download>⬇️ Download Processed Video</a>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
